<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">CadFlow Harness system architecture</title>
  <desc id="desc">A natural-language CAD task moves through the web workspace, Agent harness, deterministic CadFlow validation, and observable artifacts. Measured evidence feeds repairs and future dataset curation.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-feedback" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="#f8fafc"/>
  <text x="80" y="64" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#0f172a">CadFlow Harness architecture</text>
  <text x="80" y="98" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" fill="#526170">A measured loop from natural-language task to validated CAD artifacts</text>

  <rect x="550" y="142" width="500" height="78" rx="18" fill="#ffffff" stroke="#2f80ed" stroke-width="3"/>
  <circle cx="594" cy="181" r="20" fill="#e8f3ff" stroke="#2f80ed" stroke-width="2"/>
  <path d="M584 181h20M594 171v20" stroke="#2f80ed" stroke-width="3" stroke-linecap="round"/>
  <text x="632" y="178" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="23" font-weight="650" fill="#0f172a">Natural-language CAD task</text>
  <text x="632" y="202" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" fill="#526170">Prompt, constraints, and acceptance intent</text>

  <!-- Main flow arrows are drawn before the cards so they never obscure labels. -->
  <path d="M800 220 L800 258 L235 258 L235 350" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M235 480 L235 536" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M380 586 L450 586 L450 398" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M625 474 L625 508" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M625 604 L625 640" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M800 398 L840 398" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1015 474 L1015 508" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1015 604 L1015 640" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1190 690 C1210 690 1208 398 1230 398" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Observable run records and measured feedback. -->
  <path d="M800 428 C930 428 1050 535 1230 535" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <path d="M1230 690 C1100 860 780 860 625 604" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow-feedback)"/>
  <path d="M450 398 C350 282 170 282 235 350" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow-feedback)"/>
  <path d="M1385 595 L1385 640" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow)"/>

  <!-- Layer containers. -->
  <rect x="60" y="290" width="350" height="540" rx="20" fill="#e8f3ff" stroke="#2f80ed" stroke-width="2"/>
  <rect x="450" y="290" width="350" height="540" rx="20" fill="#eaf8f3" stroke="#159570" stroke-width="2"/>
  <rect x="840" y="290" width="350" height="540" rx="20" fill="#fff5e5" stroke="#d97706" stroke-width="2"/>
  <rect x="1230" y="290" width="310" height="540" rx="20" fill="#fff0f1" stroke="#d14d5b" stroke-width="2"/>

  <!-- Layer headings. -->
  <text x="90" y="332" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4" fill="#1d4f91">01 · EXPERIENCE</text>
  <text x="480" y="332" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4" fill="#126b52">02 · AGENT</text>
  <text x="870" y="332" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4" fill="#985006">03 · DETERMINISTIC CAD</text>
  <text x="1260" y="332" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="1.2" fill="#96333e">04 · EVIDENCE</text>

  <!-- Experience cards. -->
  <rect x="90" y="350" width="290" height="130" rx="14" fill="#ffffff" stroke="#b7d4f4" stroke-width="2"/>
  <text x="116" y="390" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="23" font-weight="650" fill="#0f172a">Web workspace</text>
  <text x="116" y="421" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" fill="#526170">Project control + 3D Viewer</text>
  <text x="116" y="453" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#1d4f91">live previews · progress · review</text>

  <rect x="90" y="536" width="290" height="100" rx="14" fill="#ffffff" stroke="#b7d4f4" stroke-width="2"/>
  <text x="116" y="576" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="23" font-weight="650" fill="#0f172a">Project / Run API</text>
  <text x="116" y="607" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" fill="#526170">FastAPI coordination surface</text>

  <!-- Agent cards. -->
  <rect x="480" y="350" width="290" height="124" rx="14" fill="#ffffff" stroke="#b6dece" stroke-width="2"/>
  <text x="506" y="390" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="23" font-weight="650" fill="#0f172a">Run Coordinator</text>
  <text x="506" y="421" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" fill="#526170">Owns the active Run lifecycle</text>
  <text x="506" y="452" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#126b52">events · retries · acceptance</text>

  <rect x="480" y="508" width="290" height="96" rx="14" fill="#ffffff" stroke="#b6dece" stroke-width="2"/>
  <text x="506" y="548" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="23" font-weight="650" fill="#0f172a">Deep Agents harness</text>
  <text x="506" y="579" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" fill="#526170">Writes and revises model.py</text>

  <rect x="480" y="640" width="290" height="100" rx="14" fill="#ffffff" stroke="#b6dece" stroke-width="2"/>
  <text x="506" y="680" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="23" font-weight="650" fill="#0f172a">CAD Skills</text>
  <text x="506" y="711" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" fill="#526170">Model · inspect · validate</text>

  <!-- Deterministic CAD cards. -->
  <rect x="870" y="350" width="290" height="124" rx="14" fill="#ffffff" stroke="#f0c989" stroke-width="2"/>
  <text x="896" y="390" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="23" font-weight="650" fill="#0f172a">Project workspace</text>
  <text x="896" y="421" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" fill="#526170">Stable code/model.py entry point</text>
  <text x="896" y="452" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#985006">source · helpers · revisions</text>

  <rect x="870" y="508" width="290" height="96" rx="14" fill="#ffffff" stroke="#f0c989" stroke-width="2"/>
  <text x="896" y="548" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="23" font-weight="650" fill="#0f172a">CadFlow kernel</text>
  <text x="896" y="579" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" fill="#526170">Deterministic geometry execution</text>

  <rect x="870" y="640" width="290" height="100" rx="14" fill="#ffffff" stroke="#f0c989" stroke-width="2"/>
  <text x="896" y="680" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="23" font-weight="650" fill="#0f172a">Geometry + Scene</text>
  <text x="896" y="711" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" fill="#526170">Validate, measure, and package</text>

  <!-- Evidence cards. -->
  <rect x="1260" y="350" width="250" height="124" rx="14" fill="#ffffff" stroke="#efb6bd" stroke-width="2"/>
  <text x="1286" y="390" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="23" font-weight="650" fill="#0f172a">Scene artifact</text>
  <text x="1286" y="421" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" fill="#526170">model.scene.zip</text>
  <text x="1286" y="452" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#96333e">accepted result for Viewer</text>

  <rect x="1260" y="508" width="250" height="87" rx="14" fill="#ffffff" stroke="#efb6bd" stroke-width="2"/>
  <text x="1286" y="548" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="23" font-weight="650" fill="#0f172a">Run trace</text>
  <text x="1286" y="579" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" fill="#526170">Events · source · metrics</text>

  <rect x="1260" y="640" width="250" height="100" rx="14" fill="#ffffff" stroke="#efb6bd" stroke-width="2"/>
  <text x="1286" y="680" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="23" font-weight="650" fill="#0f172a">Dataset direction</text>
  <text x="1286" y="711" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" fill="#526170">Scale verified trajectories</text>

  <!-- Legend. -->
  <line x1="80" y1="884" x2="125" y2="884" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="140" y="891" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" fill="#526170">primary execution flow</text>
  <line x1="390" y1="884" x2="435" y2="884" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow-feedback)"/>
  <text x="450" y="891" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" fill="#526170">measured feedback and repair</text>
  <line x1="785" y1="884" x2="830" y2="884" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="845" y="891" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" fill="#526170">observable records / future curation</text>
  <text x="80" y="932" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" fill="#64748b">CadFlow Harness keeps source, geometry evidence, progress, and accepted artifacts together in one Project.</text>
</svg>
