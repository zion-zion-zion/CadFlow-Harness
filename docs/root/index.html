<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CadFlowAgent Documentation</title>
    <meta name="description" content="Choose a language for the CadFlowAgent documentation.">
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f4f6f8; color: #17212b; }
      main { width: min(34rem, calc(100% - 3rem)); padding: 2.5rem 0; text-align: center; }
      img { width: 7rem; height: auto; }
      h1 { margin: 1.25rem 0 .5rem; font-size: clamp(1.8rem, 6vw, 2.7rem); }
      p { margin: 0 auto 2rem; color: #526170; line-height: 1.6; }
      nav { display: flex; justify-content: center; gap: .75rem; }
      a { display: inline-block; min-width: 7rem; padding: .75rem 1rem; border: 1px solid #c9d1d9; border-radius: .4rem; color: #0b5cad; background: #fff; text-decoration: none; }
      a:hover, a:focus-visible { border-color: #0b5cad; outline: 2px solid #8bbcf0; outline-offset: 2px; }
      @media (prefers-color-scheme: dark) {
        body { background: #111820; color: #e7edf3; }
        p { color: #aebdca; }
        a { border-color: #3a4a59; color: #9bc9ff; background: #1b2732; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/cadflowagent-logo.png" alt="CadFlowAgent logo">
      <h1>CadFlowAgent</h1>
      <p>Public documentation for the text-to-CAD runtime.</p>
      <nav aria-label="Documentation languages">
        <a href="en/">English</a>
        <a href="zh/">简体中文</a>
      </nav>
    </main>
  </body>
</html>
